name: publish

# Push a vX.Y.Z tag to publish HeroesClientSDK X.Y.Z: the .nupkg goes to GitHub Packages and is
# attached to the GitHub Release of that tag, which anyone can download without credentials.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Version from tag
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v(\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?)$') {
            throw "Tag $tag is not vX.Y.Z"
          }
          "version=$($Matches[1])" >> $env:GITHUB_OUTPUT
      - name: Restore tools
        run: dotnet tool restore
      - name: Format (CSharpier)
        run: dotnet csharpier check .
      - name: Build
        run: dotnet build HeroesClientSDK.slnx -c Release -p:MinVerVersionOverride=${{ steps.version.outputs.version }}
      - name: Test
        run: dotnet test HeroesClientSDK.slnx -c Release --no-build
      - name: Pack
        run: dotnet pack src/HeroesClientSDK/HeroesClientSDK.csproj -c Release --no-build -o artifacts -p:MinVerVersionOverride=${{ steps.version.outputs.version }}
      - name: Check package version
        shell: pwsh
        run: |
          $expected = "artifacts/HeroesClientSDK.${{ steps.version.outputs.version }}.nupkg"
          if (-not (Test-Path -LiteralPath $expected)) {
            Get-ChildItem artifacts
            throw "Expected $expected"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg
          if-no-files-found: error
      - name: Push to GitHub Packages
        run: dotnet nuget push "artifacts/HeroesClientSDK.${{ steps.version.outputs.version }}.nupkg" --source https://nuget.pkg.github.com/HeroesReplay/index.json --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
      # The same file as the GitHub Packages push, so its SHA-256 matches. An asset that is already
      # on the release is never replaced: consumers pin its hash (HeroesReplay pins it).
      - name: Attach to the GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ github.ref_name }}'
          $repo = '${{ github.repository }}'
          $files = @(Get-ChildItem artifacts -File | Where-Object { $_.Extension -in '.nupkg', '.snupkg' })
          $nupkg = $files | Where-Object Extension -eq '.nupkg' | Select-Object -First 1
          $sha = (Get-FileHash -LiteralPath $nupkg.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -ne 0) {
            $notes = "HeroesClientSDK ${{ steps.version.outputs.version }}.`n`n``$($nupkg.Name)`` is the package pushed to GitHub Packages by this run. It downloads without credentials.`n`nSHA-256: ``$sha``"
            gh release create $tag @($files.FullName) --repo $repo --verify-tag --title "HeroesClientSDK ${{ steps.version.outputs.version }}" --notes $notes
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed." }
            Write-Host "Created release $tag with $($files.Name -join ', ') (SHA-256 $sha)."
            exit 0
          }

          $existing = @(gh release view $tag --repo $repo --json assets --jq '.assets[].name')
          $missing = @($files | Where-Object { $existing -notcontains $_.Name })
          if ($missing.Count -eq 0) {
            Write-Host "Release $tag already has $($files.Name -join ', '). Not replaced."
            exit 0
          }

          gh release upload $tag @($missing.FullName) --repo $repo
          if ($LASTEXITCODE -ne 0) { throw "gh release upload failed." }
          Write-Host "Attached $($missing.Name -join ', ') to release $tag (SHA-256 $sha)."
