name: ci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4
        with:
          # MinVer reads the version from the tags.
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore tools
        run: dotnet tool restore
      - name: Format (CSharpier)
        run: dotnet csharpier check .
      - name: Build
        run: dotnet build HeroesClientSDK.slnx -c Release
      - name: Test
        run: dotnet test HeroesClientSDK.slnx -c Release --no-build
      - name: Pack
        run: dotnet pack src/HeroesClientSDK/HeroesClientSDK.csproj -c Release --no-build -o artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg
          if-no-files-found: error
